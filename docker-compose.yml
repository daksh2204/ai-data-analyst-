services:
  analyst:
    build: .
    image: ai-data-analyst:latest
    container_name: ai-data-analyst
    ports:
      - "8000:8000"
    # Copy .env.example to .env and add an API key. Without one the app runs on the offline engine.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
