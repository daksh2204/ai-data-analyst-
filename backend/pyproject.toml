[project]
name = "ai-data-analyst"
version = "1.0.0"
description = "Upload CSV files and analyse them in natural language: answers, charts, SQL, anomalies and forecasts."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM108", "RUF012", "SIM102", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
