name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests evals
      - name: Unit + API tests
        run: pytest
      - name: Evals (offline engine baseline)
        run: python -m evals.run_evals --provider offline --min-pass 1.0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-data-analyst:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8000:8000 ai-data-analyst:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs localhost:8000/ | grep -q "<div id=\"root\">"
          sid=$(curl -fs -X POST localhost:8000/api/sessions | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          curl -fs -X POST localhost:8000/api/sessions/$sid/datasets/samples > /dev/null
          curl -fsN -X POST localhost:8000/api/sessions/$sid/chat -H 'Content-Type: application/json' \
            -d '{"message":"Which region generated the highest revenue?"}' | grep -q '"type": "final"'
      - if: always()
        run: docker logs app || true
